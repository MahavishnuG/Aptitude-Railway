<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="railGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#railGrad)"/>
  <!-- Railway Tracks -->
  <path d="M120 420 L220 280 M392 420 L292 280" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
  <line x1="140" y1="390" x2="372" y2="390" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
  <line x1="170" y1="350" x2="342" y2="350" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/>
  <line x1="200" y1="310" x2="312" y2="310" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
  
  <!-- High Speed Loco Front -->
  <rect x="176" y="110" width="160" height="190" rx="32" fill="#ffffff" stroke="#f59e0b" stroke-width="8"/>
  <!-- Windshield -->
  <path d="M196 135 H316 Q326 135 322 170 H190 Q186 135 196 135 Z" fill="#0f172a"/>
  <!-- Train Headlight beam -->
  <circle cx="256" cy="240" r="22" fill="url(#goldGrad)"/>
  <circle cx="256" cy="240" r="14" fill="#ffffff"/>
  
  <!-- Speed lines -->
  <path d="M210 200 L302 200" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  <path d="M185 270 L327 270" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
  <!-- RRB Badge -->
  <rect x="216" y="70" width="80" height="28" rx="8" fill="#f59e0b"/>
  <text x="256" y="89" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="2">RRB</text>
  
  <!-- Thunderbolt / Speed Icon -->
  <path d="M370 120 L345 165 H375 L340 220 L350 175 H325 Z" fill="#fbbf24"/>
</svg>
