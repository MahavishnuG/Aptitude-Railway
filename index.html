    <script>
      /* Ensure window.fetch has both a getter and setter to prevent "Cannot set property fetch of #<Window> which has only a getter" */
      (function() {
        try {
          var globalObj = typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : self);
          var nativeFetch = globalObj.fetch;
          if (typeof nativeFetch === 'function') {
            var currentFetch = nativeFetch.bind(globalObj);
            try {
              Object.defineProperty(globalObj, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(newFetch) {
                  currentFetch = newFetch;
                },
                configurable: true,
                enumerable: true
              });
            } catch (defErr) {
              try {
                if (typeof Window !== 'undefined' && Window.prototype) {
                  Object.defineProperty(Window.prototype, 'fetch', {
                    get: function() {
                      return currentFetch;
                    },
                    set: function(newFetch) {
                      currentFetch = newFetch;
                    },
                    configurable: true,
                    enumerable: true
                  });
                }
              } catch (protoErr) {}
            }
          }

          window.addEventListener('error', function(e) {
            if (e && e.message && e.message.indexOf('Cannot set property fetch of') !== -1) {
              if (e.preventDefault) e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          }, true);
        } catch (e) {
          console.warn('Fetch setter protection fallback initialized:', e);
        }
      })();
    </script>
